<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 GCD & LCM Hard Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1f2937}.container{max-width:900px;margin:32px auto;padding:20px}header{background:linear-gradient(135deg,#312e81,#2563eb);color:#fff;padding:28px;border-radius:18px;margin-bottom:24px;box-shadow:0 10px 30px rgba(37,99,235,.18)}header h1{margin:0 0 8px;font-size:32px}header p{margin:0;opacity:.9}.question{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.question h3{margin:0 0 16px;line-height:1.45}label{display:block;padding:12px 14px;margin:8px 0;border:2px solid #e5e7eb;border-radius:10px;cursor:pointer;transition:.15s ease}label:hover{border-color:#6366f1;background:#eef2ff}input[type=radio]{margin-right:10px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}button{border:0;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer}#submitBtn{background:#4f46e5;color:#fff}#resetBtn{background:#e5e7eb;color:#111827}#result{display:none;background:#fff;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.correct{border-color:#16a34a!important;background:#f0fdf4!important}.wrong{border-color:#dc2626!important;background:#fef2f2!important}.unanswered{border-color:#f59e0b!important}.score{font-size:28px;font-weight:800;color:#312e81;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
<header><h1>Grade 8 — GCD & LCM Hard Quiz</h1><p>12 multiple-choice questions. Choose one answer for each question, then submit.</p></header>
<form id="quizForm"></form>
<div class="actions"><button type="button" id="submitBtn" onclick="gradeQuiz()">Submit Quiz</button><button type="button" id="resetBtn" onclick="resetQuiz()">Reset</button></div>
<div id="result"></div>
</div>
<script>
const questions=[
{q:"1. Find the GCD of 168 and 252.",options:["28","42","84","126"],answer:2},
{q:"2. Find the LCM of 72 and 120.",options:["240","360","480","720"],answer:1},
{q:"3. Find the GCD of 180, 252, and 324.",options:["12","18","36","72"],answer:2},
{q:"4. Three alarms ring every 24, 36, and 54 minutes. If they ring together at 8:00 AM, when will they next ring together?",options:["10:24 AM","11:00 AM","11:36 AM","12:12 PM"],answer:2},
{q:"5. What is the smallest number divisible by 18, 24, and 30?",options:["180","240","360","720"],answer:2},
{q:"6. A teacher has 144 red, 216 blue, and 360 green counters. She wants to make the greatest possible number of identical groups without leftovers. How many groups can she make?",options:["24","36","48","72"],answer:3},
{q:"7. Two numbers have a GCD of 12 and an LCM of 720. If one number is 144, what is the other number?",options:["48","60","72","120"],answer:1},
{q:"8. Which pair has a GCD of 18 and an LCM of 540?",options:["54 and 180","90 and 108","72 and 135","36 and 270"],answer:0},
{q:"9. The GCD of two numbers is 8 and their LCM is 240. If one number is 40, what is the other?",options:["32","48","56","64"],answer:1},
{q:"10. Two buses leave a station every 45 minutes and 75 minutes. They leave together at 7:30 AM. At what time will they next leave together?",options:["10:30 AM","11:15 AM","11:45 AM","12:30 PM"],answer:1},
{q:"11. Which statement is always true for two positive integers a and b?",options:["GCD × LCM = a + b","GCD × LCM = a × b","GCD + LCM = a × b","LCM ÷ GCD = a × b"],answer:1},
{q:"12. The GCD of two numbers is 15. Which pair could be the two numbers?",options:["45 and 75","30 and 90","60 and 100","75 and 125"],answer:0}
];
const letters=["A","B","C","D"];const form=document.getElementById("quizForm");
questions.forEach((item,qi)=>{const section=document.createElement("section");section.className="question";section.id=`question-${qi}`;const title=document.createElement("h3");title.textContent=item.q;section.appendChild(title);item.options.forEach((option,oi)=>{const label=document.createElement("label");label.id=`label-${qi}-${oi}`;label.innerHTML=`<input type="radio" name="q${qi}" value="${oi}"><strong>${letters[oi]})</strong> ${option}`;section.appendChild(label)});form.appendChild(section)});
function gradeQuiz(){let score=0,answered=0;questions.forEach((item,qi)=>{const section=document.getElementById(`question-${qi}`);section.classList.remove("unanswered");item.options.forEach((_,oi)=>document.getElementById(`label-${qi}-${oi}`).classList.remove("correct","wrong"));const selected=document.querySelector(`input[name="q${qi}"]:checked`);if(!selected){section.classList.add("unanswered");return}answered++;const selectedIndex=Number(selected.value);if(selectedIndex===item.answer){score++;document.getElementById(`label-${qi}-${selectedIndex}`).classList.add("correct")}else{document.getElementById(`label-${qi}-${selectedIndex}`).classList.add("wrong");document.getElementById(`label-${qi}-${item.answer}`).classList.add("correct")}});const percent=Math.round(score/questions.length*100);let message=percent>=90?"Excellent work.":percent>=75?"Strong result.":percent>=60?"Good start — review the harder GCD/LCM applications.":"Review GCD, LCM, prime factorization, and word-problem clues, then try again.";const result=document.getElementById("result");result.style.display="block";result.innerHTML=`<div class="score">${score} / ${questions.length} — ${percent}%</div><p>${message}</p><p>Answered: ${answered} / ${questions.length}</p>`;result.scrollIntoView({behavior:"smooth"})}
function resetQuiz(){document.getElementById("quizForm").reset();document.querySelectorAll("label").forEach(label=>label.classList.remove("correct","wrong"));document.querySelectorAll(".question").forEach(q=>q.classList.remove("unanswered"));document.getElementById("result").style.display="none";window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
