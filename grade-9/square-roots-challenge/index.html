<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Square Roots Challenge — Grade 9 Lebanese Curriculum</title>
<style>
:root{--blue:#347ff0;--purple:#6c52c7;--ink:#16233e;--muted:#647086;--bg:#eef3f9;--card:#fff;--line:#dce4ef;--pale:#eaf4ff;--mint:#e7f7ef;--green:#16865b;--red:#cf4747;--gold:#ffd267;--shadow:0 18px 55px #24334b1d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,#fff 0 16%,transparent 38%),var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}button{font:inherit}.app{width:min(1120px,94vw);margin:28px auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{font-weight:900;color:var(--blue);letter-spacing:.06em}.score{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:800}.progress{height:10px;background:#dbe4ef;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .45s ease}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(22px,4vw,48px);min-height:590px;position:relative;overflow:hidden}.panel::after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:#eaf4ff;right:-120px;top:-120px;z-index:0}.content{position:relative;z-index:1}.tag{color:var(--blue);font-weight:900;letter-spacing:.08em;font-size:14px}.type{float:right;background:#f0edff;color:var(--purple);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:900}.question{font-size:clamp(24px,3.2vw,39px);line-height:1.2;margin:18px 0 12px;letter-spacing:-.02em}.instruction{color:var(--muted);font-size:17px;line-height:1.45;margin-bottom:22px}.math{font-family:"Cambria Math","Times New Roman",serif;font-weight:700}.sqrt{display:inline-flex;align-items:flex-start;white-space:nowrap;vertical-align:-.12em}.sqrt::before{content:'√';font-family:"Cambria Math","Times New Roman",serif;font-weight:400;line-height:.93;margin-right:-.03em;transform:translateY(.08em)}.radicand{border-top:.075em solid currentColor;padding:.08em .08em 0 .04em;line-height:.88}.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:-.55em;text-align:center;line-height:1.08;margin:0 .12em}.frac>:first-child{border-bottom:.065em solid currentColor;padding:0 .17em .09em}.frac>:last-child{padding:.08em .17em 0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:18px;min-height:68px;text-align:left;font-size:22px;font-weight:800;color:var(--ink);cursor:pointer;transition:.2s}.choice:hover{border-color:#99bdf6;transform:translateY(-2px)}.choice.selected{border-color:var(--blue);background:var(--pale);box-shadow:0 0 0 3px #347ff022}.choice.correct{border-color:var(--green);background:var(--mint)}.choice.wrong{border-color:var(--red);background:#fff0f0}
.visual{display:flex;align-items:center;justify-content:center;gap:28px;background:#f7f9fc;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.garden{width:150px;aspect-ratio:1;border:5px solid #29925f;background:repeating-linear-gradient(45deg,#dff6e9 0 12px,#c7edda 12px 24px);display:grid;place-items:center;font-weight:900;color:#12613d;font-size:26px;box-shadow:inset 0 0 0 8px #ffffff88}.solar{width:210px;height:120px;transform:skew(-8deg);border:5px solid #244a7c;background:linear-gradient(90deg,transparent 48%,#9ab8e0 49% 51%,transparent 52%),linear-gradient(transparent 48%,#9ab8e0 49% 51%,transparent 52%),#d9ebff;box-shadow:12px 13px 0 #20365822}
.dnd{display:grid;gap:18px}.pool,.zone{border:2px dashed #aebed2;border-radius:17px;padding:14px;min-height:80px;background:#f8fafc}.pool{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}.zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.zone-title{font-size:15px;font-weight:900;color:var(--muted);margin-bottom:10px}.zone-body{display:flex;flex-wrap:wrap;gap:9px;min-height:46px}.drag-card{border:2px solid #c8d7e9;background:#fff;border-radius:12px;padding:11px 14px;font-size:19px;font-weight:800;cursor:grab;box-shadow:0 4px 12px #20314a12;user-select:none;transition:.18s}.drag-card:hover{border-color:var(--blue)}.drag-card.selected{border-color:var(--purple);background:#f0edff;box-shadow:0 0 0 3px #6c52c729}.drag-card:active{cursor:grabbing}.zone.over,.pool.over{border-color:var(--blue);background:var(--pale)}.zone.good{border-color:var(--green);background:var(--mint)}.zone.bad{border-color:var(--red);background:#fff0f0}.order-zones{grid-template-columns:1fr}.order-zones .zone{display:grid;grid-template-columns:42px 1fr;align-items:center}.order-number{font-size:24px;font-weight:900;color:var(--blue)}
.feedback{display:none;border-radius:15px;padding:15px 18px;margin-top:18px;font-size:17px;line-height:1.45;font-weight:700}.feedback.show{display:block;animation:pop .25s ease}.feedback.ok{background:var(--mint);color:#0b6240}.feedback.no{background:#fff0f0;color:#9d2f2f}@keyframes pop{from{transform:scale(.98);opacity:.2}}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff}.btn.primary{background:var(--blue)}.btn.secondary{background:#e9eef5;color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.intro,.result{text-align:center;padding:40px 4%}.intro h1,.result h1{font-size:clamp(38px,6vw,72px);margin:12px 0}.intro p,.result p{font-size:20px;line-height:1.55;color:var(--muted);max-width:760px;margin:0 auto 25px}.badge-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:25px 0}.badge{border-radius:999px;padding:9px 14px;background:#f0edff;color:var(--purple);font-weight:900}.big-score{font-size:78px;font-weight:900;color:var(--blue);margin:18px 0}.review{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:22px auto;max-width:700px}.review span{height:12px;border-radius:99px;background:#d7e0ea}.review .right{background:var(--green)}.review .miss{background:var(--red)}
@media(max-width:760px){.app{margin:12px auto}.panel{padding:20px;min-height:680px}.choices,.zones{grid-template-columns:1fr}.header{font-size:14px}.type{float:none;display:inline-block;margin-left:8px}.visual{flex-direction:column}.question{margin-top:13px}.review{grid-template-columns:repeat(6,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="header"><div class="brand">SQUARE ROOTS • GRADE 9</div><div class="score" id="scoreBox">Score: 0 / 12</div></header>
  <div class="progress" aria-label="Quiz progress"><span id="progressBar"></span></div>
  <section class="panel" id="panel"><div class="content" id="content"></div></section>
</main>
<script>
(() => {
'use strict';
const R=n=>`<span class="sqrt"><span class="radicand">${n}</span></span>`;
const F=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const questions=[
 {type:'mcq',title:'Simplifying a radical',q:`Write ${R('432')} in the simplified form <i>a${R('b')}</i>.`,choices:[`6${R('12')}`,`12${R('3')}`,`18${R('2')}`,`24${R('3')}`],answer:1,explain:`432 = 144 × 3, so ${R('432')} = ${R('144')}${R('3')} = 12${R('3')}.`},
 {type:'match',title:'Drag & drop • Simplified form',q:'Match each radical with its simplest form.',cards:[['a',`10${R('2')}`],['b',`11${R('2')}`],['c',`15${R('3')}`],['d',`14${R('5')}`]],zones:[['z1',R('200'),'a'],['z2',R('242'),'b'],['z3',R('675'),'c'],['z4',R('980'),'d']],explain:'Extract the largest perfect-square factor: 100, 121, 225 and 196 respectively.'},
 {type:'mcq',title:'Combining like radicals',q:`Reduce: <span class="math">4${R('3')} − ${R('75')} + ${R('27')} − 2${R('48')}</span>`,choices:[`−6${R('3')}`,`2${R('3')}`,`−2${R('6')}`,`6${R('3')}`],answer:0,explain:`${R('75')}=5${R('3')}, ${R('27')}=3${R('3')}, ${R('48')}=4${R('3')}. Thus (4−5+3−8)${R('3')}=−6${R('3')}.`},
 {type:'mcq',title:'Reasoning about a false rule',q:`Rania writes ${R('49 − 13')} = ${R('49')} − ${R('13')} = 6. Which judgment is correct?`,choices:['Correct, because both sides equal 6.',`Incorrect: ${R('a−b')} is not generally ${R('a')}−${R('b')}.`,'Correct only because 49 is a perfect square.','Incorrect because square roots cannot be subtracted.'],answer:1,explain:`The correct value is ${R('36')}=6, but ${R('49')}−${R('13')}=7−${R('13')}, which is not 6. A radical does not distribute over subtraction.`},
 {type:'sort',title:'Drag & drop • Classification',q:'Sort each number into the correct set.',cards:[['a',R('1296')],['b',R('540')],['c',F(R('225'),R('49'))],['d',R('0.81')],['e',R('98')],['f',R('2⁶ × 3⁴')]],zones:[['rat','Rational',['a','c','d','f']],['irr','Irrational',['b','e']]],explain:'A natural-number radicand gives a rational square root only when every prime exponent is even. Also √225/√49=15/7 and √0.81=0.9.'},
 {type:'mcq',title:'Real life • Square garden',visual:'garden',q:`A square garden has area <b>675 m²</b>. What is the exact perimeter?`,choices:[`15${R('3')} m`,`30${R('3')} m`,`60${R('3')} m`,`2700 m`],answer:2,explain:`Side = ${R('675')} = ${R('225×3')} = 15${R('3')} m. Perimeter = 4 × side = 60${R('3')} m.`},
 {type:'mcq',title:'Radical properties',q:`Calculate exactly: ${R(F('45','5'))} + ${R('12 × 3')}`,choices:['6','7','9','12'],answer:2,explain:`${R('45/5')}=${R('9')}=3 and ${R('12×3')}=${R('36')}=6, so the sum is 9.`},
 {type:'order',title:'Drag & drop • Rationalization',q:`Arrange the steps to rationalize ${F('7',`3${R('5')}`)}.`,cards:[['a',`${F('7',`3${R('5')}`)} × ${F(R('5'),R('5'))}`],['b',F(`7${R('5')}`,'3 × 5')],['c',F(`7${R('5')}`,'15')]],zones:[['s1','Step 1','a'],['s2','Step 2','b'],['s3','Step 3','c']],explain:`Multiply numerator and denominator by ${R('5')}. Since ${R('5')}×${R('5')}=5, the denominator becomes 15.`},
 {type:'mcq',title:'Conjugates',q:`Rationalize: ${F('4',`${R('7')} − ${R('3')}`)}`,choices:[`${R('7')} − ${R('3')}`,`${R('7')} + ${R('3')}`,`4${R('7')} + 4${R('3')}`,F(`${R('7')}+${R('3')}`,'4')],answer:1,explain:`Multiply by the conjugate. The denominator is 7−3=4, so ${F(`4(${R('7')}+${R('3')})`,'4')}=${R('7')}+${R('3')}.`},
 {type:'mcq',title:'Real life • Solar panel',visual:'solar',q:`A square solar panel has area <b>288 dm²</b>. A protective frame costs <b>3,000 L.L. per dm</b>. What is the exact frame cost?`,choices:[`36,000${R('2')} L.L.`,`72,000${R('2')} L.L.`,`144,000${R('2')} L.L.`,`864,000 L.L.`],answer:2,explain:`Side = ${R('288')}=12${R('2')} dm, so perimeter = 48${R('2')} dm. Cost = 3,000 × 48${R('2')} = 144,000${R('2')} L.L.`},
 {type:'match',title:'Drag & drop • Solving x² = a',q:'Match each equation with its complete solution set in ℝ.',cards:[['a',`x = ±5${R('2')}`],['b','x = 0'],['c','No real solution'],['d',`x = ±${F('11','6')}`]],zones:[['z1','x² = 50','a'],['z2','x² = 0','b'],['z3','x² = −9','c'],['z4',`x² = ${F('121','36')}`,'d']],explain:'For a>0, x²=a has two real solutions ±√a; for a=0, one solution; and for a<0, no real solution in ℝ.'},
 {type:'mcq',title:'Challenge • Conjugate identity',q:`Let <span class="math">x = 8 − 3${R('7')}</span> and <span class="math">y = 8 + 3${R('7')}</span>. Given that <span class="math">xy = 1</span>, find <span class="math">x² + y²</span>.`,choices:['126','128','254','256'],answer:2,explain:'x+y=16 and xy=1. Therefore x²+y²=(x+y)²−2xy=16²−2=254.'}
];
let index=-1,score=0,answered=Array(12).fill(false),results=Array(12).fill(false),selectedChoice=null,selectedCard=null,placements={};
const content=document.getElementById('content'),progress=document.getElementById('progressBar'),scoreBox=document.getElementById('scoreBox');
function intro(){index=-1;progress.style.width='0%';content.innerHTML=`<div class="intro"><div class="tag">LEBANESE CURRICULUM • HARD LEVEL</div><h1>Square Roots Challenge</h1><p>12 questions inspired by the flipchart exercises. Simplify, classify, calculate, rationalize, solve equations and apply radicals to real situations.</p><div class="badge-row"><span class="badge">8 challenge questions</span><span class="badge">4 drag & drop tasks</span><span class="badge">Immediate explanations</span></div><button class="btn primary" id="start">Start quiz</button></div>`;document.getElementById('start').onclick=()=>{index=0;render()}}
function visual(kind){if(kind==='garden')return `<div class="visual"><div class="garden">675 m²</div><b>side = ?<br>perimeter = ?</b></div>`;if(kind==='solar')return `<div class="visual"><div class="solar" aria-label="square solar panel"></div><b>288 dm²<br>frame around all four sides</b></div>`;return ''}
function render(){const q=questions[index];selectedChoice=null;selectedCard=null;placements={};progress.style.width=`${((index+1)/12)*100}%`;content.innerHTML=`<span class="tag">QUESTION ${String(index+1).padStart(2,'0')} OF 12</span><span class="type">${q.type==='mcq'?'SELECT ONE':'DRAG & DROP'}</span><h2 class="question">${q.q}</h2>${q.type==='mcq'?'<p class="instruction">Choose the best answer.</p>':'<p class="instruction">Drag each card, or tap a card and then tap its destination.</p>'}${visual(q.visual)}<div id="answerArea"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn secondary" id="resetBtn" type="button">Reset</button><button class="btn primary" id="checkBtn" type="button">Check answer</button></div>`;
 if(q.type==='mcq')renderMCQ(q);else renderDnd(q);document.getElementById('checkBtn').onclick=check;document.getElementById('resetBtn').onclick=()=>render();}
function renderMCQ(q){const a=document.getElementById('answerArea');a.className='choices';a.innerHTML=q.choices.map((c,i)=>`<button class="choice math" data-i="${i}" type="button">${c}</button>`).join('');a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{a.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedChoice=+b.dataset.i})}
function renderDnd(q){const a=document.getElementById('answerArea');a.className='dnd';const order=q.type==='order';a.innerHTML=`<div class="pool" id="pool" data-zone="pool" aria-label="Cards to place"></div><div class="zones ${order?'order-zones':''}" id="zones">${q.zones.map((z,i)=>`<div class="zone" data-zone="${z[0]}">${order?`<span class="order-number">${i+1}</span>`:''}<div><div class="zone-title">${z[1]}</div><div class="zone-body"></div></div></div>`).join('')}</div>`;const pool=document.getElementById('pool');q.cards.forEach(c=>{const el=document.createElement('div');el.className='drag-card math';el.draggable=true;el.tabIndex=0;el.setAttribute('role','button');el.dataset.card=c[0];el.innerHTML=c[1];pool.appendChild(el)});wireDnD()}
function wireDnD(){document.querySelectorAll('.drag-card').forEach(c=>{const select=()=>{document.querySelectorAll('.drag-card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selectedCard=c.dataset.card};c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.card);selectedCard=c.dataset.card});c.addEventListener('click',select);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});document.querySelectorAll('.zone,.pool').forEach(z=>{z.tabIndex=0;z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');moveCard(e.dataTransfer.getData('text/plain'),z)});z.addEventListener('click',e=>{if(e.target.closest('.drag-card'))return;if(selectedCard)moveCard(selectedCard,z)});z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selectedCard){e.preventDefault();moveCard(selectedCard,z)}})})}
function moveCard(id,zone){const card=document.querySelector(`[data-card="${id}"]`);if(!card)return;const target=zone.classList.contains('pool')?zone:zone.querySelector('.zone-body');if(!zone.classList.contains('pool')&&questions[index].type!=='sort'){const existing=target.querySelector('.drag-card');if(existing){document.getElementById('pool').appendChild(existing);delete placements[existing.dataset.card]}}target.appendChild(card);card.classList.remove('selected');selectedCard=null;if(zone.classList.contains('pool'))delete placements[id];else placements[id]=zone.dataset.zone}
function check(){const q=questions[index],fb=document.getElementById('feedback');let ok=false;if(q.type==='mcq'){if(selectedChoice===null){showFeedback(false,'Choose an answer first.');return}ok=selectedChoice===q.answer;document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===selectedChoice&&i!==q.answer)b.classList.add('wrong')})}else{const placed=q.cards.every(c=>placements[c[0]]);if(!placed){showFeedback(false,'Place every card before checking.');return}ok=q.zones.every(z=>{const expected=Array.isArray(z[2])?z[2]:[z[2]];const actual=Object.entries(placements).filter(([,zone])=>zone===z[0]).map(([card])=>card);return expected.length===actual.length&&expected.every(x=>actual.includes(x))});document.querySelectorAll('.zone').forEach(z=>{const spec=q.zones.find(x=>x[0]===z.dataset.zone),expected=Array.isArray(spec[2])?spec[2]:[spec[2]],actual=Object.entries(placements).filter(([,zone])=>zone===z.dataset.zone).map(([card])=>card),good=expected.length===actual.length&&expected.every(x=>actual.includes(x));z.classList.add(good?'good':'bad')});document.querySelectorAll('.drag-card').forEach(c=>c.draggable=false)}if(!answered[index]){answered[index]=true;results[index]=ok;if(ok)score++;scoreBox.textContent=`Score: ${score} / 12`}showFeedback(ok,`${ok?'Correct!':'Not quite.'} ${q.explain}`);const checkBtn=document.getElementById('checkBtn');checkBtn.textContent=index===11?'See results':'Next question';checkBtn.onclick=()=>{if(index===11)finish();else{index++;render()}};document.getElementById('resetBtn').disabled=true}
function showFeedback(ok,msg){const fb=document.getElementById('feedback');fb.className=`feedback show ${ok?'ok':'no'}`;fb.innerHTML=msg}
function finish(){progress.style.width='100%';const pct=Math.round(score/12*100),message=pct>=85?'Excellent mastery!':pct>=65?'Strong work—review the missed ideas.':'Good effort—use the explanations, then try again.';content.innerHTML=`<div class="result"><div class="tag">QUIZ COMPLETE</div><h1>${message}</h1><div class="big-score">${score}/12</div><p>${pct}% correct. Green bars show correct answers and red bars show questions to review.</p><div class="review">${results.map(x=>`<span class="${x?'right':'miss'}"></span>`).join('')}</div><button class="btn primary" id="again">Try again</button></div>`;document.getElementById('again').onclick=()=>{score=0;answered.fill(false);results.fill(false);scoreBox.textContent='Score: 0 / 12';intro()}}
intro();
})();
</script>
</body>
</html>
